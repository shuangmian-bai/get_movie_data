<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 不发送 Referer，避免第三方海报/资源被防盗链拦截 -->
  <meta name="referrer" content="no-referrer">
  <title>影视数据源服务(开发中)</title>
  <meta name="description" content="欢迎各位大佬扩展评价，提交Pull Request到https://github.com/shuangmian-bai/get_movie_data/" />
  <link rel="stylesheet" href="index.css">
  <!-- hls.js：浏览器播放 HLS 所需（原生播放 m3u8） -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <h1>影视数据源服务(开发中)</h1>
  <p>欢迎各位大佬扩展评价</p>
  <p>欢迎各位大佬扩展评价，提交Pull Request到<a href="https://github.com/shuangmian-bai/get_movie_data/">https://github.com/shuangmian-bai/get_movie_data/</a></p>

  <div class="search">
    <input id="key" type="text" placeholder="输入影视关键词，如：仙逆" />
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>

  <!-- 数据源多选（默认全选） -->
  <div class="source-select" id="source-select">
    <span class="source-label">数据源：</span>
    <div class="source-checks" id="source-checks">数据源加载中…</div>
  </div>

  <!-- 搜索结果视图 -->
  <div id="search-view">
    <div id="results"></div>
    <div class="pager" id="pager" hidden>
      <button id="prev-btn" onclick="gotoPage(currentPage - 1)">← 上一页</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn" onclick="gotoPage(currentPage + 1)">下一页 →</button>
    </div>
  </div>

  <!-- 详情视图（含选集 + 播放地址） -->
  <div id="detail-view" hidden>
    <button class="back" onclick="backToSearch()">← 返回搜索</button>
    <div id="detail"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
