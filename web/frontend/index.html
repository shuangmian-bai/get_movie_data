<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 不发送 Referer，避免第三方海报/资源被防盗链拦截 -->
  <meta name="referrer" content="no-referrer">
  <title>影视数据源服务(开发中)</title>
  <title>欢迎各位大佬扩展评价</title>
  <meta name="description" content="欢迎各位大佬扩展评价，提交Pull Request到https://github.com/shuangmian-bai/get_movie_data/" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    .home-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .home-bg[hidden] { display: none; }
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    @media (min-width: 721px) {
      .bg-video {
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(-90deg);
      }
    }
    .page { position: relative; z-index: 1; }
    .masthead {
      position: relative;
      margin-bottom: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: rgba(255,255,255,.22);
      background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.08) 55%, rgba(255,255,255,.18));
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
    }
    @media (prefers-color-scheme: dark) {
      .masthead {
        border-color: rgba(255,255,255,.18);
        background: rgba(17,19,24,.26);
        background: linear-gradient(135deg, rgba(17,19,24,.34), rgba(17,19,24,.10) 55%, rgba(17,19,24,.22));
      }
    }
    .audio-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: inherit;
      font-size: 17px;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .audio-toggle:hover { background: rgba(255,255,255,.28); transform: scale(1.05); }
    @media (prefers-color-scheme: dark) {
      .audio-toggle {
        border-color: rgba(255,255,255,.22);
        background: rgba(255,255,255,.10);
      }
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 900px; margin: 0 auto; padding: 24px 16px; line-height: 1.5;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sources { color: #888; font-size: 13px; margin-bottom: 18px; }
    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 10px;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
    }
    input[type=text], input.url {
      flex: 1; padding: 10px 12px; font-size: 15px;
      border: 1px solid #ccc; border-radius: 6px; background: transparent; color: inherit;
    }
    button { cursor: pointer; }
    button.search-btn {
      padding: 10px 20px; font-size: 15px; border: none; border-radius: 6px;
      background: #2563eb; color: #fff;
    }
    button.search-btn:hover { background: #1d4ed8; }

    .source-select {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 10px;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
    }
    .source-label { color: #888; font-size: 14px; line-height: 30px; flex-shrink: 0; }
    .source-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .source-check { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: inherit; cursor: pointer; }
    .source-check input { cursor: pointer; }

    .card {
      display: flex; gap: 12px; align-items: flex-start;
      border: 1px solid rgba(128,128,128,.25); border-radius: 8px;
      padding: 10px; margin-bottom: 12px; cursor: pointer;
      transition: background .15s;
    }
    .card:hover { background: rgba(128,128,128,.08); }
    .cover { width: 84px; height: 112px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #ddd; }
    .cover.placeholder, .cover-lg.placeholder {
      display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px;
    }
    .card .info { flex: 1; min-width: 0; }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .meta { color: #888; font-size: 13px; font-weight: normal; }
    .desc { font-size: 14px; color: #666; margin-top: 6px; }
    .empty { color: #999; padding: 20px 0; }

    .pager { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 16px; }
    .pager button {
      padding: 8px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: inherit; cursor: pointer;
    }
    .pager button:disabled { opacity: .4; cursor: not-allowed; }
    .pager button:not(:disabled):hover { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.5); }
    .pager .page-info { color: #888; font-size: 14px; min-width: 120px; text-align: center; }

    .back {
      margin-bottom: 14px; padding: 8px 14px; font-size: 14px;
      border: 1px solid #ccc; border-radius: 6px; background: transparent; color: inherit;
    }
    .detail-head { display: flex; gap: 16px; margin-bottom: 20px; }
    .cover-lg { width: 150px; height: 200px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #ddd; }
    .detail-info { flex: 1; min-width: 0; }
    .detail-info h2 { margin: 0 0 8px; font-size: 20px; }
    .detail-info .meta { margin-bottom: 10px; }

    .eps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ep {
      padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
      background: transparent; color: inherit; min-width: 56px; text-align: center;
    }
    .ep:hover { background: rgba(37,99,235,.12); border-color: #2563eb; }

    .play { margin-top: 20px; padding: 14px; border: 1px solid rgba(128,128,128,.25); border-radius: 8px; }
    .play .meta { margin-bottom: 8px; }
    .play .row { display: flex; gap: 8px; }
    .play-mode { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin: 16px 0 10px; }
    .play-mode-label { color: #888; font-size: 14px; flex-shrink: 0; }
    .play-mode-item { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; cursor: pointer; }
    .play-mode-item input { cursor: pointer; }
    .player-video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
    .player-placeholder {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 16/9; background: #000; border-radius: 8px; color: #aaa;
      font-size: 14px;
    }
    .rtsp { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .rtsp input {
      flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc;
      border-radius: 6px; background: transparent; color: inherit;
    }
    .rtsp button { padding: 8px 14px; font-size: 13px; border: none; border-radius: 6px; background: #2563eb; color: #fff; }
    .rtsp button:hover { background: #1d4ed8; }
    .hint { color: #888; font-size: 12px; margin-top: 8px; }
  </style>
  <!-- hls.js：浏览器播放 HLS 所需（转流输出的本地 HLS） -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <div class="home-bg" id="home-bg" aria-hidden="true">
    <video id="bg-video" class="bg-video" src="a.mp4" loop playsinline preload="auto"></video>
  </div>

  <div class="page">
    <header class="masthead">
      <button id="audio-toggle" class="audio-toggle" type="button" aria-label="切换背景声音" aria-pressed="false">🔇</button>
      <h1>影视数据源服务(开发中)</h1>
      <p>欢迎各位大佬扩展评价</p>
      <p>欢迎各位大佬扩展评价，提交Pull Request到<a href="https://github.com/shuangmian-bai/get_movie_data/">https://github.com/shuangmian-bai/get_movie_data/</a></p>
    </header>

    <div class="search">
    <input id="key" type="text" placeholder="输入影视关键词，如：仙逆" />
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>

  <!-- 数据源多选（默认全选） -->
  <div class="source-select" id="source-select">
    <span class="source-label">数据源：</span>
    <div class="source-checks" id="source-checks">数据源加载中…</div>
  </div>

  <!-- 搜索结果视图 -->
  <div id="search-view">
    <div id="results"></div>
    <div class="pager" id="pager" hidden>
      <button id="prev-btn" onclick="gotoPage(currentPage - 1)">← 上一页</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn" onclick="gotoPage(currentPage + 1)">下一页 →</button>
    </div>
  </div>

  <!-- 详情视图（含选集 + 播放地址） -->
  <div id="detail-view" hidden>
    <button class="back" onclick="backToSearch()">← 返回搜索</button>
    <div id="detail"></div>
  </div>
  </div>

  <script>
    const PAGE_SIZE = 20;   // 每页条数（后端 start/count 分页）
    let currentKey = '';     // 当前搜索关键词
    let currentPage = 0;     // 当前展示页（0-based，始终指向有数据的页）
    let searchResults = [];  // 当前页数据
    let hasNext = true;      // 是否还有下一页
    let currentInfo = null;
    let currentSid = null;  // 当前转流会话 id（切换/返回时停止）

    // HTML 转义，防止动态文本破坏结构 / XSS
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 封面：有 URL 显示图片（加载失败自动隐藏），否则占位
    function coverHtml(cover, cls, tip) {
      return cover
        ? `<img class="${cls}" src="${esc(cover)}" alt="" onerror="this.style.display='none'">`
        : `<div class="${cls} placeholder">${tip}</div>`;
    }

    // 数据源多选（默认全选）
    fetch('/api/sources')
      .then(r => r.json())
      .then(list => {
        const box = document.getElementById('source-checks');
        box.innerHTML = list.map(s => `
          <label class="source-check">
            <input type="checkbox" data-url="${esc(s.base_url)}" checked> ${esc(s.source_name)}
          </label>`).join('');
      })
      .catch(() => document.getElementById('source-checks').textContent = '数据源加载失败');

    // 读取当前勾选的数据源 base_url（无勾选返回空数组）
    function selectedUrls() {
      return Array.from(document.querySelectorAll('#source-checks input:checked'))
        .map(el => el.dataset.url);
    }

    // 渲染单个结果卡片
    function renderCard(item, i) {
      return `
        <div class="card" onclick="showDetail(${i})">
          ${coverHtml(item.cover, 'cover', '无图')}
          <div class="info">
            <h3>${esc(item.name)} <span class="meta">${esc(item.type)}${item.year ? ' · ' + esc(item.year) : ''}</span></h3>
            <div class="desc">${esc(item.desc)}</div>
          </div>
        </div>`;
    }

    // 渲染当前页结果 + 分页条
    function renderResults() {
      document.getElementById('results').innerHTML = searchResults.map(renderCard).join('');
      renderPager();
    }

    function renderPager() {
      const pager = document.getElementById('pager');
      if (!currentKey || !searchResults.length) { pager.hidden = true; return; }
      pager.hidden = false;
      document.getElementById('page-info').textContent =
        '第 ' + (currentPage + 1) + ' 页' + (hasNext ? '' : ' · 已到最后一页');
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = !hasNext;
    }

    // 发起一次分页请求：只抓 [start, start+PAGE_SIZE) 这一页，按需爬取
    async function fetchPage(page) {
      const box = document.getElementById('results');
      const urls = selectedUrls();
      if (!urls.length) {
        box.innerHTML = '<div class="empty">请至少选择一个数据源</div>';
        document.getElementById('pager').hidden = true;
        return;
      }
      box.innerHTML = '搜索中…';
      document.getElementById('pager').hidden = true;
      try {
        const start = page * PAGE_SIZE;
        const qs = urls.map(u => '&base_urls=' + encodeURIComponent(u)).join('');
        const resp = await fetch('/api/search?key=' + encodeURIComponent(currentKey) + '&start=' + start + '&count=' + PAGE_SIZE + qs);
        const list = await resp.json();
        if (!resp.ok) { box.innerHTML = '<div class="empty">请求失败：' + resp.status + '</div>'; return; }
        if (!list.length) {
          if (page === 0) {
            currentKey = '';
            searchResults = [];
            box.innerHTML = '<div class="empty">无结果</div>';
          } else {
            // 翻过头：停留在上一页，禁用下一页
            hasNext = false;
            renderResults();
          }
          return;
        }
        currentPage = page;
        searchResults = list;
        hasNext = true;
        renderResults();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        box.innerHTML = '<div class="empty">搜索失败：' + esc(e) + '</div>';
      }
    }

    // 新搜索（固定从第 0 页开始）
    async function doSearch() {
      const key = document.getElementById('key').value.trim();
      if (!key) return;
      currentKey = key;
      currentPage = 0;
      hasNext = true;
      searchResults = [];
      await fetchPage(0);
    }

    // 翻页（上一页/下一页）
    async function gotoPage(page) {
      if (!currentKey) return;
      await fetchPage(page);
    }

    // 点击结果 -> 详情 + 选集
    async function showDetail(i) {
      const item = searchResults[i];
      if (!item) return;
      document.getElementById('search-view').hidden = true;
      document.getElementById('detail-view').hidden = false;
      document.getElementById('home-bg').hidden = true;
      const detail = document.getElementById('detail');
      detail.innerHTML = '加载详情中…';
      try {
        const resp = await fetch('/api/info?base_url=' + encodeURIComponent(item.base_url) + '&link=' + encodeURIComponent(item.link));
        const info = await resp.json();
        if (!resp.ok) { detail.innerHTML = '<div class="empty">详情加载失败：' + resp.status + '</div>'; return; }
        currentInfo = info;
        detail.innerHTML = renderDetail(info);
      } catch (e) {
        detail.innerHTML = '<div class="empty">详情加载失败：' + esc(e) + '</div>';
      }
    }

    function renderDetail(info) {
      const eps = info.episodes || [];
      const epBtns = eps.length
        ? '<div class="eps">' + eps.map(ep => `<button class="ep" onclick="playEpisode(${ep.index})">${esc(ep.name)}</button>`).join('') + '</div>'
        : '<div class="empty">暂无分集</div>';
      return `
        <div class="detail-head">
          ${coverHtml(info.cover, 'cover-lg', '无图')}
          <div class="detail-info">
            <h2>${esc(info.name)}</h2>
            <div class="meta">${esc(info.type)}${info.year ? ' · ' + esc(info.year) : ''}</div>
            <div class="desc">${esc(info.desc)}</div>
          </div>
        </div>
        <div class="play-mode">
          <span class="play-mode-label">播放方式：</span>
<!--          <label class="play-mode-item"><input type="radio" name="play-mode" value="processed" checked> 流处理（去广告 · 转流 · 缓存）</label>-->
          <label class="play-mode-item"><input type="radio" name="play-mode" value="native"> 原生 m3u8（直连 · 无转流/缓存/去广告）</label>
        </div>
        <div id="play-result">
          <div class="play player-shell">
            <div class="player-placeholder">请选择分集开始播放</div>
          </div>
        </div>
        <h3>选集（${eps.length}）</h3>
        ${epBtns}`;
    }

    // 停止上一个转流会话（切换集数/返回时清理）
    async function stopCurrentStream() {
      if (!currentSid) return;
      try { await fetch('/api/stream/' + encodeURIComponent(currentSid), { method: 'DELETE' }); } catch (e) {}
      currentSid = null;
    }

    // 读取当前选中的播放方式（processed=流处理去广告转流；native=原生直连 m3u8）
    function currentPlayMode() {
      const el = document.querySelector('input[name="play-mode"]:checked');
      return el ? el.value : 'processed';
    }

    // 点击选集 -> 按所选播放方式播放
    async function playEpisode(epIndex) {
      if (!currentInfo) return;
      const box = document.getElementById('play-result');
      const mode = currentPlayMode();
      box.innerHTML = '<div class="play player-shell"><div class="meta">获取播放地址中…</div></div>';
      await stopCurrentStream();
      try {
        // 1. 拿原始播放地址
        const resp = await fetch('/api/play?base_url=' + encodeURIComponent(currentInfo.base_url) + '&link=' + encodeURIComponent(currentInfo.link) + '&episode_index=' + epIndex);
        const play = await resp.json();
        if (!resp.ok) {
          box.innerHTML = '<div class="play player-shell"><div class="empty">播放地址获取失败：' + resp.status + '</div></div>';
          return;
        }

        // 原生播放：直接播放原始 m3u8/mp4，不走转流/缓存/去广告
        if (mode === 'native') {
          playNative(play, box);
          return;
        }

        // 2. 按站点转流（内部去广告），输出本地 HLS
        const sresp = await fetch('/api/stream/processed', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_url: currentInfo.base_url,
            source: { url: play.url, type: play.type || 'm3u8', headers: play.headers || {} }
          })
        });
        const stream = await sresp.json();
        if (!sresp.ok || stream.status === 'error') {
          box.innerHTML = '<div class="play player-shell"><div class="empty">转流失败：' + esc(stream.error || stream.detail || ('HTTP ' + sresp.status)) + '</div></div>';
          return;
        }
        currentSid = stream.sid;

        // 3. 渲染内嵌播放器并播放
        const rtsp = stream.rtsp_url
          ? '<div class="rtsp"><input id="rtsp-url" readonly onclick="this.select()" value="' + esc(stream.rtsp_url) + '"><button onclick="copyRtsp()">复制 RTSP</button></div>'
          : '';
        box.innerHTML = `
          <div class="play">
            <div class="meta">类型：${esc(stream.source_type || play.type)} · 会话 ${esc(stream.sid)} · ${esc(stream.status)}</div>
            <video id="player" class="player-video" controls></video>
            ${rtsp}
            <div class="hint" id="player-err"></div>
          </div>`;
        playHls(stream.hls_url);
      } catch (e) {
        box.innerHTML = '<div class="play player-shell"><div class="empty">播放失败：' + esc(e) + '</div></div>';
      }
    }

    // 原生直连播放：直接播原始 m3u8/mp4（不转流、不缓存、不去广告）
    function playNative(play, box) {
      const type = String(play.type || 'm3u8').toLowerCase();
      box.innerHTML = `
        <div class="play">
          <div class="meta">类型：${esc(play.type || 'm3u8')} · 原生直连（无转流/缓存/去广告）</div>
          <video id="player" class="player-video" controls></video>
          <div class="hint" id="player-err"></div>
          <div class="hint">提示：原生直连不带防盗链请求头，如播放失败（403/跨域）请改用「流处理」方式。</div>
        </div>`;
      if (type === 'mp4') {
        document.getElementById('player').src = play.url;   // mp4 直链
      } else {
        playHls(play.url);                                   // m3u8 交给 hls.js
      }
    }

    // 用 hls.js 播放本地 HLS（Safari 原生回退）
    function playHls(hlsUrl) {
      const video = document.getElementById('player');
      const errEl = document.getElementById('player-err');
      const showErr = msg => { if (errEl) errEl.textContent = msg; };
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, function (e, data) { if (data.fatal) showErr('HLS 播放错误：' + data.type); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hlsUrl; // Safari 原生 HLS
      } else {
        showErr('当前浏览器不支持 HLS，请复制 RTSP 地址用原生客户端播放');
      }
    }

    function copyRtsp() {
      const input = document.getElementById('rtsp-url');
      input.select();
      navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
    }

    // 返回搜索
    function backToSearch() {
      stopCurrentStream();
      document.getElementById('detail-view').hidden = true;
      document.getElementById('search-view').hidden = false;
      document.getElementById('home-bg').hidden = false;
      currentInfo = null;
    }

    // 回车触发搜索
    document.getElementById('key').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
  <script>
    // 背景视频：尽量带声音播放；若被浏览器自动播放策略拦截，先静音保证画面，
    // 用户任意点击/按键/触摸时恢复声音，也可点击右上角声音按钮手动切换。
    (function () {
      var v = document.getElementById('bg-video');
      var btn = document.getElementById('audio-toggle');
      if (!v) return;

      function renderState() {
        if (!btn) return;
        btn.textContent = v.muted ? '🔇' : '🔊';
        btn.setAttribute('aria-pressed', v.muted ? 'false' : 'true');
      }

      function setMuted(m) {
        v.muted = m;
        renderState();
      }

      function unmute() {
        setMuted(false);
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }

      function tryPlay() {
        var p = v.play();
        if (p && p.catch) {
          p.catch(function () {
            setMuted(true);
            var retry = v.play();
            if (retry && retry.catch) retry.catch(function () {});
          });
        }
      }

      var events = ['pointerdown', 'keydown', 'touchstart', 'click'];
      function onGesture() {
        if (v.muted) unmute();
      }
      events.forEach(function (evt) {
        document.addEventListener(evt, onGesture, { passive: true });
      });

      if (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (v.muted) {
            unmute();
          } else {
            setMuted(true);
          }
        });
      }

      renderState();
      tryPlay();
    })();
  </script>
</body>
</html>
