<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流播放器</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #111; color: #eee; max-width: 960px; margin: 0 auto; padding: 24px 16px;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color: #999; font-size: 13px; margin-bottom: 16px; }
    video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
    .rtsp {
      margin-top: 16px; padding: 12px; border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px; font-size: 13px; display: flex; gap: 8px; align-items: center;
    }
    .rtsp input { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; color: #eee; }
    .rtsp button { padding: 8px 14px; font-size: 13px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    .rtsp button:hover { background: #1d4ed8; }
    .error { color: #f87171; margin-top: 16px; font-size: 14px; }
    .hint { color: #888; font-size: 12px; margin-top: 8px; }
  </style>
  <!-- hls.js：浏览器播放 HLS 所需；离线环境可将此文件本地化 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <h1>流播放器</h1>
  <div class="meta" id="meta">加载中…</div>
  <video id="video" controls></video>
  <div class="rtsp" id="rtsp" hidden>
    <input id="rtsp-url" readonly onclick="this.select()">
    <button onclick="copyRtsp()">复制 RTSP 地址</button>
  </div>
  <div class="error" id="error"></div>
  <div class="hint">HLS 由浏览器 hls.js 播放；RTSP 地址供原生客户端（VLC / ffplay / ijkplayer）拉流。</div>

  <script>
    // 从 URL 提取会话 id：/api/stream/{sid}/player -> sid
    const parts = location.pathname.split('/').filter(Boolean);
    const sid = parts[parts.length - 2];

    const video = document.getElementById('video');
    const meta = document.getElementById('meta');

    function showError(msg) {
      document.getElementById('error').textContent = msg;
      meta.textContent = '加载失败';
    }

    async function load() {
      try {
        const resp = await fetch('/api/stream/' + encodeURIComponent(sid));
        const info = await resp.json();
        if (!resp.ok) { showError('获取流信息失败：' + resp.status); return; }
        if (info.status === 'error') { showError('流创建失败：' + (info.error || '未知错误')); return; }

        meta.textContent = '会话 ' + info.sid + ' · ' + info.status +
          (info.source_url ? ' · 源：' + info.source_url : '');

        // RTSP 地址展示
        if (info.rtsp_url) {
          document.getElementById('rtsp-url').value = info.rtsp_url;
          document.getElementById('rtsp').hidden = false;
        }

        // 播放 HLS
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(info.hls_url);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, function (e, data) {
            if (data.fatal) showError('HLS 播放错误：' + data.type);
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = info.hls_url; // Safari 原生 HLS
        } else {
          showError('当前浏览器不支持 HLS 播放');
        }
      } catch (e) {
        showError('加载失败：' + e);
      }
    }

    function copyRtsp() {
      const input = document.getElementById('rtsp-url');
      input.select();
      navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
    }

    load();
  </script>
</body>
</html>
